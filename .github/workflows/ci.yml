name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pip, no secrets)
        run: pip install -e "apps/api[test]"
        # TODO(TK-002): switch to uv sync when lockfile lands
      - name: Lint
        run: python -m ruff check apps/api
      - name: Test
        run: python -m pytest -q apps/api/tests

  worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pip, no secrets)
        run: pip install -e "apps/worker[test]"
      - name: Lint
        run: python -m ruff check apps/worker
      - name: Test
        run: python -m pytest -q apps/worker/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install
        run: npm --prefix apps/web install
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Test
        run: npm --prefix apps/web test
