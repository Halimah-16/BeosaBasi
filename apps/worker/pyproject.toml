[project]
name = "beosabasi-worker"
version = "0.1.0"
description = "BeosaBasi inference worker (Windows laptop). Scaffold for TK-005/TK-030+."
requires-python = "==3.12.*"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# 'test' extra bundles test + lint tooling so `uv sync --extra test`
# (or `pip install -e .[test]`) is enough for `make lint` and `make test`.
test = ["pytest>=8,<9", "ruff>=0.8"]

[project.scripts]
worker = "worker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
